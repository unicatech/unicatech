<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
        <meta name="description" content="POS - Bootstrap Admin Template">
        <meta name="keywords" content="admin, estimates, bootstrap, business, corporate, creative, management, minimal, modern,  html5, responsive">
        <meta name="author" content="Dreamguys - Bootstrap Admin Template">
        <meta name="robots" content="noindex, nofollow">
        <title>Dreams Pos admin template</title>
        
        <!-- Favicon -->
        <link rel="shortcut icon" type="image/x-icon" href="{% static 'img/favicon.png' %}"">
        
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}"">
        
        <!-- animation CSS -->
        <link rel="stylesheet" href="{% static 'css/animate.css' %}"">

        <!-- Datatable CSS -->
        <link rel="stylesheet" href="{% static 'css/dataTables.bootstrap4.min.css' %}"">
        
        <!-- Fontawesome CSS -->
        <link rel="stylesheet" href="{% static 'plugins/fontawesome/css/fontawesome.min.css' %}"">
        <link rel="stylesheet" href="{% static 'plugins/fontawesome/css/all.min.css' %}"">
        
        <!-- Main CSS -->
        <link rel="stylesheet" href="{% static 'css/style.css' %}"">
        
    </head>
    <body class="error-page">
        <div id="global-loader" >
            <div class="whirly-loader"> </div>
        </div>
        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <div class="error-box">
				<h1>404</h1>
				<h3 class="h2 mb-3"><i class="fas fa-exclamation-circle"></i> Oops! Page not found!</h3>
				<p class="h4 font-weight-normal">The page you requested was not found.</p>
				<a href="index.html" class="btn btn-primary">Back to Home</a>
			</div>
        </div>
        <!-- /Main Wrapper -->
       
        <!-- jQuery -->
        <script src="{% static 'js/jquery-3.6.0.min.js' %}""></script>

        <!-- Feather Icon JS -->
        <script src="{% static 'js/feather.min.js' %}""></script>

        <!-- Slimscroll JS -->
        <script src="{% static 'js/jquery.slimscroll.min.js' %}""></script>

        
        <!-- Bootstrap Core JS -->
        <script src="{% static 'js/bootstrap.bundle.min.js' %}""></script>
        
        <!-- Custom JS -->
        <script src="{% static 'js/script.js' %}""></script>
        
    </body>
</html>
